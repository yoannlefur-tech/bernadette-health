nelmio_cors:
    defaults:
        # Credentials are allowed, so the origin is a single exact value, never a pattern.
        origin_regex: false
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_credentials: true
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Authorization', 'Content-Type']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/': null
